<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Docket — General Goods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEEBE3;
    --paper-dim:#E4E0D4;
    --surface:#FFFFFF;
    --ink:#201C18;
    --ink-soft:#5B564D;
    --line:#D8D2C4;
    --stamp:#B23A2E;
    --stamp-ink:#FFF7F4;
    --ok:#3D6B4F;
    --ok-bg:#E7EFE7;
    --warn:#C4832B;
    --focus:#2645C7;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .mono{font-family:'JetBrains Mono', monospace;}
  .display{font-family:'Fraunces', serif;}

  /* ---------- Ledger header bar ---------- */
  .ledger-strip{
    background:var(--ink);
    color:var(--paper);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    padding:6px 20px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:4px 20px;
  }
  .ledger-strip span{opacity:.8;}

  header.top{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:40;
  }
  .top-inner{
    max-width:1180px;margin:0 auto;padding:16px 20px;
    display:flex;align-items:center;gap:24px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:24px;
    letter-spacing:-.01em;
    display:flex;align-items:center;gap:8px;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--stamp);display:inline-block;}
  .search-wrap{flex:1;max-width:520px;}
  .search-wrap input{
    width:100%;padding:10px 14px;border:1px solid var(--line);
    background:var(--paper-dim);border-radius:var(--radius);font-size:14px;
  }
  .top-actions{display:flex;align-items:center;gap:6px;margin-left:auto;}
  .icon-btn{
    background:transparent;border:1px solid transparent;padding:8px 12px;
    border-radius:var(--radius);font-size:13px;display:flex;align-items:center;gap:6px;
    color:var(--ink);
  }
  .icon-btn:hover{border-color:var(--line);background:var(--paper-dim);}
  .badge{
    background:var(--stamp);color:var(--stamp-ink);font-family:'JetBrains Mono',monospace;
    font-size:10px;padding:1px 6px;border-radius:10px;
  }

  nav.cats{
    max-width:1180px;margin:0 auto;padding:0 20px 14px;
    display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);
  }
  nav.cats a{padding:4px 0;border-bottom:2px solid transparent;}
  nav.cats a:hover, nav.cats a.active{color:var(--ink);border-color:var(--stamp);}

  main{max-width:1180px;margin:0 auto;padding:32px 20px 80px;}

  /* ---------- Hero / status line ---------- */
  .hero-line{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:28px;flex-wrap:wrap;gap:12px;
  }
  .hero-line h1{font-family:'Fraunces',serif;font-size:32px;margin:0;font-weight:600;}
  .hero-line .meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}

  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;align-items:center;
  }
  .toolbar select{
    padding:8px 10px;border:1px solid var(--line);background:var(--surface);
    border-radius:var(--radius);font-size:13px;
  }
  .toolbar .spacer{flex:1;}
  .toolbar .count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}

  /* ---------- Product grid: docket tags ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;
  }
  .tag-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    position:relative;
    padding:16px 14px 14px;
    display:flex;flex-direction:column;gap:8px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .tag-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(32,28,24,.08);}
  .tag-card::before{
    content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);
    width:14px;height:14px;background:var(--paper);border:1px solid var(--line);border-radius:50%;
  }
  .tag-card .perf{
    border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:2px;
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .tag-card .cat-label{
    font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink-soft);
  }
  .tag-card .stock-pill{
    font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;border-radius:8px;
  }
  .stock-pill.in{background:var(--ok-bg);color:var(--ok);}
  .stock-pill.low{background:#F7EBD8;color:var(--warn);}
  .stock-pill.out{background:#F3E1DE;color:var(--stamp);}
  .tag-card .pname{font-family:'Fraunces',serif;font-size:17px;font-weight:600;line-height:1.25;min-height:2.4em;}
  .tag-card .prating{font-size:12px;color:var(--ink-soft);}
  .tag-card .price-row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;}
  .tag-card .price{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;}
  .tag-card .add-btn{
    background:var(--ink);color:var(--paper);border:none;padding:8px 12px;
    border-radius:var(--radius);font-size:12px;font-weight:600;letter-spacing:.02em;
  }
  .tag-card .add-btn:hover{background:var(--stamp);}
  .tag-card .add-btn:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}

  /* ---------- Buttons / forms ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--ink);color:var(--paper);border:none;
    padding:11px 20px;border-radius:var(--radius);font-size:13px;font-weight:600;letter-spacing:.02em;
  }
  .btn:hover{background:var(--stamp);}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--ink);background:transparent;}
  .btn.sm{padding:7px 12px;font-size:12px;}
  .btn:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}
  .field input, .field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--surface);font-size:14px;
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;
  }
  .auth-wrap{max-width:380px;margin:20px auto;}
  .auth-wrap h2{font-family:'Fraunces',serif;font-size:26px;margin:0 0 6px;}
  .auth-wrap .sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px;}
  .switch-line{margin-top:16px;font-size:13px;color:var(--ink-soft);text-align:center;}
  .switch-line a{color:var(--stamp);font-weight:600;}

  /* ---------- Cart drawer (receipt scroll) ---------- */
  .drawer-backdrop{
    position:fixed;inset:0;background:rgba(32,28,24,.4);z-index:60;
    display:none;
  }
  .drawer-backdrop.open{display:block;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;
    background:var(--paper);border-left:1px solid var(--line);z-index:61;
    display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .25s ease;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:20px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer-head h3{font-family:'Fraunces',serif;font-size:20px;margin:0;}
  .drawer-body{flex:1;overflow-y:auto;padding:14px 20px;}
  .drawer-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px dotted var(--line);}
  .drawer-item .info{flex:1;}
  .drawer-item .pname{font-size:13px;font-weight:600;}
  .drawer-item .unit{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .qty-ctrl{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .qty-ctrl button{width:22px;height:22px;border:1px solid var(--line);background:var(--surface);border-radius:2px;font-size:13px;line-height:1;}
  .qty-ctrl .n{font-family:'JetBrains Mono',monospace;font-size:13px;min-width:16px;text-align:center;}
  .drawer-item .line-total{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;}
  .remove-x{color:var(--stamp);font-size:11px;font-family:'JetBrains Mono',monospace;margin-top:6px;display:inline-block;}
  .drawer-foot{border-top:1px dashed var(--line);padding:18px 20px;background:var(--surface);}
  .total-row{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;margin-bottom:14px;}

  /* ---------- Product detail ---------- */
  .pdp{display:grid;grid-template-columns:340px 1fr;gap:40px;}
  @media(max-width:760px){.pdp{grid-template-columns:1fr;}}
  .pdp-image{
    aspect-ratio:1;background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;
    font-size:48px;color:var(--line);border-radius:var(--radius);
  }
  .pdp h1{font-family:'Fraunces',serif;font-size:34px;margin:0 0 8px;}
  .pdp .price-big{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;margin:14px 0;}
  .pdp .desc{color:var(--ink-soft);line-height:1.6;margin-bottom:22px;}
  .qty-select{display:flex;align-items:center;gap:14px;margin-bottom:18px;}

  .review{border-bottom:1px solid var(--line);padding:16px 0;}
  .review .stars{color:var(--warn);font-size:14px;}
  .review .who{font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
  .review .comment{margin-top:6px;font-size:14px;}

  /* ---------- Orders ---------- */
  .order-card{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;background:var(--surface);}
  .order-head{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px dashed var(--line);font-family:'JetBrains Mono',monospace;font-size:12px;}
  .status-pill{padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .status-PENDING{background:#F7EBD8;color:var(--warn);}
  .status-PAID{background:#E4EAF7;color:var(--focus);}
  .status-SHIPPED{background:#E7EFE7;color:var(--ok);}
  .status-DELIVERED{background:var(--ink);color:var(--paper);}
  .status-CANCELLED{background:#F3E1DE;color:var(--stamp);}
  .order-items{padding:14px 18px;}
  .order-line{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;}
  .order-total{padding:14px 18px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-weight:700;}

  /* ---------- Empty / misc ---------- */
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty .big{font-family:'Fraunces',serif;font-size:22px;color:var(--ink);margin-bottom:8px;}
  .toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:var(--radius);
    font-size:13px;font-family:'JetBrains Mono',monospace;box-shadow:0 6px 20px rgba(0,0,0,.2);
    animation:rise .2s ease;
  }
  .toast.err{background:var(--stamp);}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .config-bar{
    background:var(--paper-dim);border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:11px;
    padding:8px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--ink-soft);
  }
  .config-bar input{
    background:var(--surface);border:1px solid var(--line);padding:4px 8px;font-size:11px;
    font-family:'JetBrains Mono',monospace;border-radius:2px;width:280px;
  }
  .config-bar button{background:transparent;border:1px solid var(--line);padding:4px 10px;border-radius:2px;font-size:11px;}

  .skel{background:linear-gradient(90deg,var(--paper-dim) 25%,var(--line) 50%,var(--paper-dim) 75%);background-size:200% 100%;animation:shine 1.3s infinite;border-radius:2px;}
  @keyframes shine{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div class="config-bar">
  <span>API BASE</span>
  <input id="apiBaseInput" type="text" />
  <button id="apiBaseSave">Save</button>
  <span id="apiStatus" style="margin-left:auto;"></span>
</div>

<div class="ledger-strip">
  <span id="ledgerDate"></span>
  <span id="ledgerUser">GUEST • NOT SIGNED IN</span>
</div>

<header class="top">
  <div class="top-inner">
    <a href="#/" class="brand"><span class="dot"></span>Docket</a>
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="Search the catalog…" />
    </div>
    <div class="top-actions">
      <a href="#/wishlist" class="icon-btn">Saved</a>
      <a href="#/orders" class="icon-btn">Orders</a>
      <button id="cartBtn" class="icon-btn">Cart <span id="cartCount" class="badge">0</span></button>
      <span id="authArea"></span>
    </div>
  </div>
  <nav class="cats" id="catNav"></nav>
</header>

<main id="app"></main>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="cartDrawer">
  <div class="drawer-head">
    <h3>Your Cart</h3>
    <button class="icon-btn" id="closeDrawer">Close ✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>Total</span><span id="drawerTotal" class="mono">$0.00</span></div>
    <a href="#/checkout" class="btn" style="width:100%;" id="checkoutBtn">Go to checkout</a>
  </div>
</aside>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================= STATE ============================= */
const state = {
  apiBase: 'http://localhost:8000/api/v1',
  token: null,
  user: null,
  categories: [],
  cart: { id: null, items: [], total: 0 },
  currentCategory: null,
  searchQuery: '',
};

/* ============================= API LAYER ============================= */
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
  const res = await fetch(state.apiBase + path, { ...opts, headers });
  let body = null;
  try { body = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    const msg = (body && (body.detail || body.message)) || `Request failed (${res.status})`;
    throw new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
  }
  return body;
}

/* ============================= TOASTS ============================= */
function toast(msg, isErr = false) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ============================= HELPERS ============================= */
function money(v) {
  const n = typeof v === 'number' ? v : parseFloat(v || 0);
  return '$' + n.toFixed(2);
}
function mediaUrl(path) {
  if (!path) return '';
  if (path.startsWith('http')) return path; // уже абсолютный URL (например с loremflickr)
  const origin = state.apiBase.replace(/\/api\/v1\/?$/, '');
  return origin + path;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stockPill(qty) {
  if (qty <= 0) return `<span class="stock-pill out">Out of stock</span>`;
  if (qty <= 5) return `<span class="stock-pill low">${qty} left</span>`;
  return `<span class="stock-pill in">In stock</span>`;
}

/* ============================= AUTH ============================= */
function renderAuthArea() {
  const el = document.getElementById('authArea');
  const ledgerUser = document.getElementById('ledgerUser');
  if (state.user) {
    el.innerHTML = `<a href="#/orders" class="icon-btn">${escapeHtml(state.user.full_name || state.user.email)}</a>
      ${state.user.role === 'ADMIN' ? '<a href="#/admin" class="icon-btn">Admin</a>' : ''}
      <button class="icon-btn" id="logoutBtn">Sign out</button>`;
    document.getElementById('logoutBtn').onclick = logout;
    ledgerUser.textContent = `SIGNED IN • ${(state.user.email || '').toUpperCase()}${state.user.role === 'ADMIN' ? ' • ADMIN' : ''}`;
  } else {
    el.innerHTML = `<a href="#/login" class="icon-btn">Sign in</a>`;
    ledgerUser.textContent = 'GUEST • NOT SIGNED IN';
  }
}

async function tryLoadUser() {
  if (!state.token) return;
  try {
    state.user = await api('/auth/me');
  } catch (e) {
    state.token = null;
    state.user = null;
  }
  renderAuthArea();
}

function logout() {
  state.token = null;
  state.user = null;
  state.cart = { id: null, items: [], total: 0 };
  renderAuthArea();
  renderCartCount();
  toast('Signed out');
  location.hash = '#/';
}

/* ============================= CART ============================= */
async function refreshCart() {
  if (!state.token) { state.cart = { id: null, items: [], total: 0 }; renderCartCount(); return; }
  try {
    const c = await api('/cart/');
    state.cart = c;
  } catch (e) {
    state.cart = { id: null, items: [], total: 0 };
  }
  renderCartCount();
  renderDrawer();
}

function renderCartCount() {
  const count = (state.cart.items || []).reduce((a, i) => a + i.quantity, 0);
  document.getElementById('cartCount').textContent = count;
}

function renderDrawer() {
  const body = document.getElementById('drawerBody');
  const items = state.cart.items || [];
  if (!items.length) {
    body.innerHTML = `<div class="empty"><div class="big">Cart is empty</div>Browse the catalog to add something.</div>`;
  } else {
    body.innerHTML = items.map(i => `
      <div class="drawer-item">
        <div class="info">
          <div class="pname">${escapeHtml(i.product_name)}</div>
          <div class="unit mono">${money(i.unit_price)} each</div>
          <div class="qty-ctrl">
            <button data-act="dec" data-pid="${i.product_id}">−</button>
            <span class="n">${i.quantity}</span>
            <button data-act="inc" data-pid="${i.product_id}">+</button>
          </div>
          <a href="#" class="remove-x" data-act="remove" data-pid="${i.product_id}">Remove</a>
        </div>
        <div class="line-total mono">${money(i.subtotal)}</div>
      </div>
    `).join('');
  }
  document.getElementById('drawerTotal').textContent = money(state.cart.total || 0);

  body.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const pid = parseInt(btn.dataset.pid);
      const act = btn.dataset.act;
      const item = items.find(i => i.product_id === pid);
      try {
        if (act === 'remove') {
          await api(`/cart/items/${pid}`, { method: 'DELETE' });
        } else if (act === 'inc') {
          await api(`/cart/items/${pid}`, { method: 'PUT', body: JSON.stringify({ quantity: item.quantity + 1 }) });
        } else if (act === 'dec') {
          if (item.quantity <= 1) {
            await api(`/cart/items/${pid}`, { method: 'DELETE' });
          } else {
            await api(`/cart/items/${pid}`, { method: 'PUT', body: JSON.stringify({ quantity: item.quantity - 1 }) });
          }
        }
        await refreshCart();
      } catch (err) {
        toast(err.message, true);
      }
    });
  });
}

async function addToCart(productId, qty = 1) {
  if (!state.token) { toast('Sign in to add items to your cart', true); location.hash = '#/login'; return; }
  try {
    await api('/cart/items', { method: 'POST', body: JSON.stringify({ product_id: productId, quantity: qty }) });
    await refreshCart();
    toast('Added to cart');
    openDrawer();
  } catch (e) {
    toast(e.message, true);
  }
}

function openDrawer() {
  document.getElementById('cartDrawer').classList.add('open');
  document.getElementById('drawerBackdrop').classList.add('open');
}
function closeDrawer() {
  document.getElementById('cartDrawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
}

/* ============================= CATEGORIES ============================= */
async function loadCategories() {
  try {
    state.categories = await api('/categories');
  } catch (e) {
    state.categories = [];
  }
  const nav = document.getElementById('catNav');
  nav.innerHTML = `<a href="#/" class="${!state.currentCategory ? 'active' : ''}">All goods</a>` +
    state.categories.map(c => `<a href="#/category/${c.id}" class="${state.currentCategory == c.id ? 'active' : ''}">${escapeHtml(c.name)}</a>`).join('');
}

/* ============================= VIEWS ============================= */
const app = document.getElementById('app');

function skeletonGrid(n = 8) {
  return `<div class="grid">${Array.from({length:n}).map(() => `
    <div class="tag-card"><div class="skel" style="height:14px;width:60%;"></div>
    <div class="skel" style="height:40px;"></div>
    <div class="skel" style="height:18px;width:40%;"></div></div>`).join('')}</div>`;
}

function productCard(p) {
  const stock = p.stock_quantity ?? p.stock ?? 0;
  return `
    <div class="tag-card">
      <div class="perf">
        <span class="cat-label">${escapeHtml(p.category?.name || '')}</span>
        ${stockPill(stock)}
      </div>
      ${p.image_url ? `<img src="${escapeHtml(mediaUrl(p.image_url))}" alt="${escapeHtml(p.name)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;margin:4px 0;" loading="lazy" />` : ''}
      <a href="#/product/${p.id}" class="pname">${escapeHtml(p.name)}</a>
      <div class="prating">★ ${(p.average_rating ?? p.avg_rating ?? 0) || '—'} ${p.review_count ? `(${p.review_count})` : ''}</div>
      <div class="price-row">
        <span class="price">${money(p.price)}</span>
        <button class="add-btn" ${stock <= 0 ? 'disabled' : ''} data-pid="${p.id}">${stock <= 0 ? 'Sold out' : 'Add'}</button>
      </div>
    </div>`;
}

function wireAddButtons(root) {
  root.querySelectorAll('.add-btn[data-pid]').forEach(btn => {
    btn.addEventListener('click', () => addToCart(parseInt(btn.dataset.pid)));
  });
}

async function viewCatalog(categoryId = null) {
  state.currentCategory = categoryId;
  document.querySelectorAll('nav.cats a').forEach(a => a.classList.remove('active'));
  app.innerHTML = `
    <div class="hero-line">
      <h1>${categoryId ? (state.categories.find(c=>c.id==categoryId)?.name || 'Category') : 'Full catalog'}</h1>
      <span class="meta" id="resultMeta">loading…</span>
    </div>
    <div class="toolbar">
      <select id="sortSelect">
        <option value="newest">Newest</option>
        <option value="price_asc">Price: low to high</option>
        <option value="price_desc">Price: high to low</option>
        <option value="rating">Top rated</option>
      </select>
      <div class="spacer"></div>
      <span class="count" id="pageCount"></span>
    </div>
    <div id="gridWrap">${skeletonGrid()}</div>
  `;
  loadCategories();
  await loadProducts();
  document.getElementById('sortSelect').addEventListener('change', loadProducts);
}

async function loadProducts() {
  const sort = document.getElementById('sortSelect')?.value || 'newest';
  const params = new URLSearchParams();
  if (state.searchQuery) params.set('q', state.searchQuery);
  if (state.currentCategory) params.set('category_id', state.currentCategory);
  params.set('sort_by', sort);
  params.set('page', '1');
  params.set('page_size', '24');
  try {
    const res = await api('/products/search?' + params.toString());
    const items = res.items || res || [];
    document.getElementById('gridWrap').innerHTML = items.length
      ? `<div class="grid">${items.map(productCard).join('')}</div>`
      : `<div class="empty"><div class="big">Nothing here yet</div>Try a different search or category.</div>`;
    wireAddButtons(document.getElementById('gridWrap'));
    const meta = document.getElementById('resultMeta');
    if (meta) meta.textContent = `${res.total ?? items.length} items`;
  } catch (e) {
    document.getElementById('gridWrap').innerHTML = `<div class="empty"><div class="big">Couldn't reach the catalog</div>${escapeHtml(e.message)}<br><br>Check the API base URL above and make sure the backend is running with CORS enabled.</div>`;
  }
}

async function viewProduct(id) {
  app.innerHTML = `<div class="skel" style="height:400px;"></div>`;
  try {
    // no single-product GET was defined in our API — try /products/{id}, fall back to search
    let p;
    try { p = await api(`/products/${id}`); }
    catch (e) {
      const res = await api(`/products/search?page=1&page_size=100`);
      p = (res.items || res || []).find(x => x.id == id);
      if (!p) throw new Error('Product not found');
    }
    let reviews = { reviews: [], summary: { average_rating: 0, review_count: 0 } };
    try { reviews = await api(`/reviews/product/${id}`); } catch (e) {}

    const stock = p.stock_quantity ?? p.stock ?? 0;
    app.innerHTML = `
      <a href="#/" class="icon-btn" style="margin-bottom:20px;display:inline-block;">← Back to catalog</a>
      <div class="pdp">
        <div>
          <div class="pdp-image">
 <div class="pdp-image">
  ${p.image_url ? `<img src="${escapeHtml(mediaUrl(p.image_url))}" alt="${escapeHtml(p.name)}" style="width:100%;height:100%;object-fit:cover;" />` : escapeHtml((p.name||'?').charAt(0))}
</div>
</div>
        </div>
        <div>
          <span class="cat-label mono">${escapeHtml(p.category?.name || '')}</span>
          <h1>${escapeHtml(p.name)}</h1>
          <div class="prating">★ ${reviews.summary.average_rating || 0} · ${reviews.summary.review_count || 0} reviews · ${stockPill(stock)}</div>
          <div class="price-big">${money(p.price)}</div>
          <p class="desc">${escapeHtml(p.description || 'No description provided for this item.')}</p>
          <button class="btn" id="pdpAdd" ${stock <= 0 ? 'disabled' : ''}>${stock <= 0 ? 'Sold out' : 'Add to cart'}</button>
          <button class="btn ghost" id="pdpWish" style="margin-left:8px;">Save for later</button>

          <div style="margin-top:40px;">
            <h3 class="display" style="font-size:20px;">Reviews</h3>
            <div id="reviewsList">${
              reviews.reviews.length
                ? reviews.reviews.map(r => `
                  <div class="review">
                    <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
                    <div class="who">USER #${r.user_id} · ${new Date(r.created_at).toLocaleDateString()}</div>
                    ${r.comment ? `<div class="comment">${escapeHtml(r.comment)}</div>` : ''}
                  </div>`).join('')
                : '<p style="color:var(--ink-soft);font-size:14px;">No reviews yet.</p>'
            }</div>
            ${state.user ? `
              <div class="card" style="margin-top:16px;max-width:420px;">
                <div class="field"><label>Your rating (1–5)</label><input type="number" min="1" max="5" id="revRating" value="5" /></div>
                <div class="field"><label>Comment (optional)</label><textarea id="revComment" rows="3"></textarea></div>
                <button class="btn sm" id="submitReview">Post review</button>
              </div>` : `<p style="color:var(--ink-soft);font-size:13px;margin-top:10px;"><a href="#/login" style="color:var(--stamp);">Sign in</a> to leave a review (purchase required).</p>`}
          </div>
        </div>
      </div>
    `;
    document.getElementById('pdpAdd')?.addEventListener('click', () => addToCart(p.id));
    document.getElementById('pdpWish')?.addEventListener('click', () => addToWishlist(p.id));
    document.getElementById('submitReview')?.addEventListener('click', async () => {
      try {
        const rating = parseInt(document.getElementById('revRating').value);
        const comment = document.getElementById('revComment').value;
        await api('/reviews/', { method: 'POST', body: JSON.stringify({ product_id: p.id, rating, comment: comment || null }) });
        toast('Review posted');
        viewProduct(id);
      } catch (e) { toast(e.message, true); }
    });
  } catch (e) {
    app.innerHTML = `<div class="empty"><div class="big">Couldn't load this item</div>${escapeHtml(e.message)}</div>`;
  }
}

async function addToWishlist(productId) {
  if (!state.token) { toast('Sign in to save items', true); location.hash = '#/login'; return; }
  try {
    await api('/wishlist/', { method: 'POST', body: JSON.stringify({ product_id: productId }) });
    toast('Saved to wishlist');
  } catch (e) { toast(e.message, true); }
}

function viewLogin() {
  app.innerHTML = `
    <div class="auth-wrap card">
      <h2>Sign in</h2>
      <div class="sub">Access your cart, orders and saved items.</div>
      <div class="field"><label>Email</label><input type="email" id="loginEmail" /></div>
      <div class="field"><label>Password</label><input type="password" id="loginPass" /></div>
      <button class="btn" style="width:100%;" id="loginBtn">Sign in</button>
      <div class="switch-line">New here? <a href="#/register">Create an account</a></div>
    </div>`;
  document.getElementById('loginBtn').addEventListener('click', async () => {
    try {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPass').value;
      const res = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      state.token = res.access_token || res.token;
      await tryLoadUser();
      await refreshCart();
      toast('Welcome back');
      location.hash = '#/';
    } catch (e) { toast(e.message, true); }
  });
}

function viewRegister() {
  app.innerHTML = `
    <div class="auth-wrap card">
      <h2>Create an account</h2>
      <div class="sub">Takes a minute. No spam, ever.</div>
      <div class="field"><label>Full name</label><input type="text" id="regName" /></div>
      <div class="field"><label>Email</label><input type="email" id="regEmail" /></div>
      <div class="field"><label>Password</label><input type="password" id="regPass" /></div>
      <button class="btn" style="width:100%;" id="regBtn">Create account</button>
      <div class="switch-line">Already have one? <a href="#/login">Sign in</a></div>
    </div>`;
  document.getElementById('regBtn').addEventListener('click', async () => {
    try {
      const full_name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPass').value;
      await api('/auth/register', { method: 'POST', body: JSON.stringify({ full_name, email, password }) });
      toast('Account created — signing you in…');
      const res = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      state.token = res.access_token || res.token;
      await tryLoadUser();
      await refreshCart();
      location.hash = '#/';
    } catch (e) { toast(e.message, true); }
  });
}

async function viewCheckout() {
  if (!state.token) { location.hash = '#/login'; return; }
  await refreshCart();
  const items = state.cart.items || [];
  app.innerHTML = `
    <div class="hero-line"><h1>Checkout</h1></div>
    ${!items.length ? `<div class="empty"><div class="big">Your cart is empty</div><a href="#/" class="btn" style="margin-top:14px;">Browse the catalog</a></div>` : `
    <div class="pdp">
      <div class="card">
        <h3 class="display" style="margin-top:0;">Order summary</h3>
        ${items.map(i => `<div class="order-line"><span>${escapeHtml(i.product_name)} × ${i.quantity}</span><span class="mono">${money(i.subtotal)}</span></div>`).join('')}
        <div class="order-total" style="margin-top:10px;border-top:1px dashed var(--line);padding-top:12px;"><span>Total</span><span>${money(state.cart.total)}</span></div>
      </div>
      <div class="card">
        <h3 class="display" style="margin-top:0;">Shipping address</h3>
        <div class="field"><textarea id="shipAddr" rows="4" placeholder="Street, city, postal code, country"></textarea></div>
        <button class="btn" style="width:100%;" id="placeOrderBtn">Place order — ${money(state.cart.total)}</button>
      </div>
    </div>`}
  `;
  document.getElementById('placeOrderBtn')?.addEventListener('click', async () => {
    const addr = document.getElementById('shipAddr').value.trim();
    if (!addr) { toast('Enter a shipping address', true); return; }
    try {
      const order = await api('/orders/checkout', { method: 'POST', body: JSON.stringify({ shipping_address: addr }) });
      await refreshCart();
      toast('Order placed');
      location.hash = `#/orders`;
    } catch (e) { toast(e.message, true); }
  });
}

function orderCard(o) {
  return `
    <div class="order-card">
      <div class="order-head">
        <span>ORDER #${o.id} · ${new Date(o.created_at).toLocaleDateString()}</span>
        <span class="status-pill status-${o.status}">${o.status}</span>
      </div>
      <div class="order-items">
        ${(o.items || []).map(i => `<div class="order-line"><span>${escapeHtml(i.product_name)} × ${i.quantity}</span><span class="mono">${money(i.subtotal ?? (i.unit_price*i.quantity))}</span></div>`).join('')}
      </div>
      <div class="order-total"><span>Total</span><span>${money(o.total_amount ?? o.total)}</span></div>
    </div>`;
}

async function viewOrders() {
  if (!state.token) { location.hash = '#/login'; return; }
  app.innerHTML = `<div class="hero-line"><h1>Your orders</h1></div><div id="ordersWrap">${skeletonGrid(3)}</div>`;
  try {
    const orders = await api('/orders/');
    document.getElementById('ordersWrap').innerHTML = orders.length
      ? orders.map(orderCard).join('')
      : `<div class="empty"><div class="big">No orders yet</div><a href="#/" class="btn" style="margin-top:14px;">Start shopping</a></div>`;
  } catch (e) {
    document.getElementById('ordersWrap').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

async function viewWishlist() {
  if (!state.token) { location.hash = '#/login'; return; }
  app.innerHTML = `<div class="hero-line"><h1>Saved items</h1></div><div id="wishWrap">${skeletonGrid(4)}</div>`;
  try {
    const items = await api('/wishlist/');
    document.getElementById('wishWrap').innerHTML = items.length
      ? `<div class="grid">${items.map(i => `
          <div class="tag-card">
            <div class="perf"><span class="cat-label">SAVED</span></div>
            <a href="#/product/${i.product_id}" class="pname">${escapeHtml(i.product_name)}</a>
            <div class="price-row">
              <span class="price">${money(i.price)}</span>
              <button class="add-btn" data-pid="${i.product_id}" data-remove="1">Remove</button>
            </div>
          </div>`).join('')}</div>`
      : `<div class="empty"><div class="big">Nothing saved yet</div>Tap "Save for later" on any product.</div>`;
    document.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try { await api(`/wishlist/${btn.dataset.pid}`, { method: 'DELETE' }); viewWishlist(); }
        catch (e) { toast(e.message, true); }
      });
    });
  } catch (e) {
    document.getElementById('wishWrap').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

async function viewAdmin() {
  if (!state.user || state.user.role !== 'ADMIN') { app.innerHTML = `<div class="empty"><div class="big">Admins only</div></div>`; return; }
  app.innerHTML = `
    <div class="hero-line"><h1>Admin · Orders</h1></div>
    <div class="toolbar">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option>PENDING</option><option>PAID</option><option>SHIPPED</option><option>DELIVERED</option><option>CANCELLED</option>
      </select>
    </div>
    <div id="adminOrders">${skeletonGrid(3)}</div>`;
  async function load() {
    const status = document.getElementById('statusFilter').value;
    const qs = status ? `?order_status=${status}` : '';
    try {
      const orders = await api('/orders/admin/all' + qs);
      document.getElementById('adminOrders').innerHTML = orders.length ? orders.map(o => `
        <div class="order-card">
          <div class="order-head">
            <span>ORDER #${o.id} · USER #${o.user_id} · ${new Date(o.created_at).toLocaleDateString()}</span>
            <span class="status-pill status-${o.status}">${o.status}</span>
          </div>
          <div class="order-items">
            ${(o.items||[]).map(i => `<div class="order-line"><span>${escapeHtml(i.product_name)} × ${i.quantity}</span></div>`).join('')}
          </div>
          <div class="order-total">
            <span>Total ${money(o.total_amount ?? o.total)}</span>
            <span style="display:flex;gap:6px;">
              <select data-oid="${o.id}" class="statusSelect">
                ${['PENDING','PAID','SHIPPED','DELIVERED','CANCELLED'].map(s => `<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
              </select>
              <button class="btn sm" data-update="${o.id}">Update</button>
            </span>
          </div>
        </div>`).join('') : `<div class="empty">No orders match this filter.</div>`;

      document.querySelectorAll('[data-update]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const oid = btn.dataset.update;
          const sel = document.querySelector(`.statusSelect[data-oid="${oid}"]`);
          try {
            await api(`/orders/admin/${oid}/status`, { method: 'PATCH', body: JSON.stringify({ status: sel.value }) });
            toast(`Order #${oid} updated`);
            load();
          } catch (e) { toast(e.message, true); }
        });
      });
    } catch (e) {
      document.getElementById('adminOrders').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
    }
  }
  document.getElementById('statusFilter').addEventListener('change', load);
  load();
}

/* ============================= ROUTER ============================= */
async function router() {
  closeDrawer();
  const hash = location.hash || '#/';
  const [, path, arg] = hash.split('/');
  window.scrollTo(0, 0);
  if (!path) return viewCatalog();
  if (path === 'category' && arg) return viewCatalog(arg);
  if (path === 'product' && arg) return viewProduct(arg);
  if (path === 'login') return viewLogin();
  if (path === 'register') return viewRegister();
  if (path === 'checkout') return viewCheckout();
  if (path === 'orders') return viewOrders();
  if (path === 'wishlist') return viewWishlist();
  if (path === 'admin') return viewAdmin();
  return viewCatalog();
}
window.addEventListener('hashchange', router);

/* ============================= WIRE-UP ============================= */
document.getElementById('cartBtn').addEventListener('click', openDrawer);
document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);

let searchTimer;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.searchQuery = e.target.value.trim();
    if (!location.hash.startsWith('#/product')) loadProducts();
  }, 350);
});

document.getElementById('ledgerDate').textContent = new Date().toDateString().toUpperCase();

async function initApiBase() {
  const input = document.getElementById('apiBaseInput');
  try {
    const saved = await window.storage.get('docket_api_base');
    if (saved && saved.value) state.apiBase = saved.value;
  } catch (e) { /* no saved value yet */ }
  input.value = state.apiBase;
  document.getElementById('apiBaseSave').addEventListener('click', async () => {
    state.apiBase = input.value.trim().replace(/\/$/, '');
    try { await window.storage.set('docket_api_base', state.apiBase); } catch (e) {}
    toast('API base updated');
    boot();
  });
}

async function checkApiHealth() {
  const status = document.getElementById('apiStatus');
  status.textContent = 'checking…';
  try {
    await api('/categories');
    status.textContent = '● connected';
    status.style.color = 'var(--ok)';
  } catch (e) {
    status.textContent = '● unreachable — check base URL / CORS / backend running';
    status.style.color = 'var(--stamp)';
  }
}

async function boot() {
  renderAuthArea();
  await checkApiHealth();
  await loadCategories();
  await tryLoadUser();
  await refreshCart();
  router();
}

initApiBase().then(boot);
</script>
